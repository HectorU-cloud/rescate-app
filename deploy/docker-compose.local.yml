# SOLO para pruebas en tu computadora o red local: expone la API sin HTTPS en
# el puerto 8000 (http://IP-DE-TU-PC:8000), por ejemplo para el emulador o un
# telefono en tu misma red.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# NUNCA lo uses en el servidor de produccion.
services:
  app:
    ports:
      - "8000:8000"
