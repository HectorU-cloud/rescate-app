# Servidor completo en un VPS: API + PostgreSQL + HTTPS automatico (Caddy).
#
#   cd deploy
#   cp .env.example .env        # y completa DOMAIN y DB_PASSWORD
#   cp ../backend/.env.example ../backend/.env   # y completa SECRET_KEY, etc.
#   docker compose up -d --build
#
# Ver docs/DESPLIEGUE.md

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rescate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en deploy/.env}
      POSTGRES_DB: rescate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescate -d rescate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      # Tiene prioridad sobre lo que pongas en backend/.env
      DATABASE_URL: postgresql://rescate:${DB_PASSWORD}@db:5432/rescate
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000" 
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
